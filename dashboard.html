<!-- Global error capture — runs before the app bundle so it catches ALL errors including cross-origin -->
<script>
(function(){
  function addErr(entry){
    if(window.__dashAddError)window.__dashAddError(entry);
    else{var q=window.__dashErrQueue=window.__dashErrQueue||[];q.push(entry);}
  }
  // "Script error." is the browser's redacted message for cross-origin script errors
  // (including CORS failures from fetch). They are not actionable, so we ignore them.
  function isNoise(msg){
    var s=String(msg||"");
    return s==="Script error."||s==="Script error"||s.indexOf("localhost")!==-1||s.indexOf("127.0.0.1")!==-1;
  }
  var _prev=window.onerror;
  window.onerror=function(msg,src,line,col,err){
    if(isNoise(msg)||(src&&(src.indexOf("localhost")!==-1||src.indexOf("127.0.0.1")!==-1)))return false;
    var e={id:Date.now(),time:new Date().toLocaleTimeString(),fn:"global ["+(src||"").split("/").pop()+":"+(line||"?")+"]",msg:(err&&err.message)?err.message:String(msg),stack:(err&&err.stack)?err.stack:""};
    console.error("[Dashboard] Uncaught:",e.fn,e.msg);
    addErr(e);
    if(_prev)_prev.apply(this,arguments);
    return false;
  };
  window.addEventListener("unhandledrejection",function(ev){
    var err=ev.reason;
    var msg=(err&&err.message)?err.message:String(err);
    if(isNoise(msg))return;
    var e={id:Date.now(),time:new Date().toLocaleTimeString(),fn:"promise",msg:msg,stack:(err&&err.stack)?err.stack:""};
    console.error("[Dashboard] Unhandled rejection:",e.msg);
    addErr(e);
  });
})();
</script>

<script>
window.addEventListener('error', function(e) {
  var el = document.getElementById('app-error');
  if (el) {
    el.style.display = 'block';
    el.innerHTML = '<h2 style="color:#ff6b6b;margin-bottom:16px">Dashboard Error</h2>' +
      '<p style="color:#e8eaf6;margin-bottom:8px;font-size:13px">Please report this to your developer:</p>' +
      '<pre style="background:rgba(255,255,255,0.05);padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap;color:#ffd166">' +
      (e.message || 'Unknown error') + '\n\n' + (e.filename || '') + ':' + (e.lineno || '') + '</pre>';
  }
});
</script>
