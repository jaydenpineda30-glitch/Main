name: Boardroom evening nudge

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC = 8pm AEST (Apr-Oct). Two entries cover both DST states; job gates on actual Melbourne local hour below so only one fires.
    - cron: '0 9 * * *'    # 09:00 UTC = 8pm AEDT (Oct-Apr).
  workflow_dispatch:

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Melbourne local time
        run: |
          HOUR=$(TZ=Australia/Melbourne date +%H)
          echo "Melbourne local hour is $HOUR"
          if [ "$HOUR" != "20" ]; then
            echo "Not 8pm Melbourne local time (AEST/AEDT drift day) - skipping run."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        if: env.SKIP != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-admin
        if: env.SKIP != 'true'
        run: npm install firebase-admin@^13.10.0

      - name: Write service account key from secret
        if: env.SKIP != 'true'
        run: printf '%s' "$SA_JSON" > personal-dashboard-53b0d-firebase-adminsdk-fbsvc-1d6afe66d0.json
        env:
          SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}

      - name: Run boardroom nudge
        if: env.SKIP != 'true'
        run: node boardroom-nudge.js
