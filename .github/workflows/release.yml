name: Patch Notes

on:
  # Manual trigger, for when a release needs regenerating without an app change —
  # e.g. this workflow itself failed and the fix touched only workflow files, which
  # the paths filter below deliberately ignores.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.jsx'          # app source (compiled to app.js)
      - 'app.js'           # compiled bundle that actually ships
      - 'dashboard.html'   # shell (CDN scripts, mount point)
      - 'gemini-service.js'
      - 'ollama-service.js'
      - 'boardroom-service.js'
      - 'gcal-sync.js'
      - 'export-to-obsidian.js'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version tag
        id: version
        run: echo "tag=v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build release notes from commits
        id: notes
        run: |
          # Get commits since last tag, or last 10 if no tags exist
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline -10 --pretty=format:"- %s")
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --oneline --pretty=format:"- %s")
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Write version.json
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          DATE="$(date +'%Y-%m-%d')"
          cat > version.json <<EOF
          {
            "version": "$TAG",
            "date": "$DATE",
            "short": "$(git rev-parse --short HEAD)"
          }
          EOF

      - name: Commit version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --staged --quiet; then
            echo "version.json unchanged"
          else
            git commit -m "chore: bump version to ${{ steps.version.outputs.tag }}"
            git push
          fi

      - name: Create release
        uses: actions/github-script@v7
        # Commit subjects reach this step through the environment, never pasted into
        # the script body. Interpolating them directly meant one backtick or ${ in a
        # commit message could break the release or run arbitrary code.
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NOTES: ${{ steps.notes.outputs.commits }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const notes = process.env.RELEASE_NOTES || '';
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: 'Dashboard ' + tag,
              body: '## What changed\n\n' + notes + '\n\n---\n*Auto-generated on push to main*',
              draft: false,
              prerelease: false
            });
